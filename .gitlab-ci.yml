variables:
  NODE_IMAGE: ${CI_REGISTRY_IMAGE}/node-20:latest

stages:
  - install
  - build
  - check
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: ${NODE_IMAGE}

.node-modules-cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull
  before_script:
    - echo -e "\e[0Ksection_start:`date +%s`:npm_install[collapsed=true]\r\e[0KInstalling dependencies"
    - pnpm config set store-dir .pnpm-store
    - pnpm install --prefer-offline
    - echo -e "\e[0Ksection_end:`date +%s`:npm_install\r\e[0K"

install:
  stage: install
  extends:
    - .node-modules-cache
  except:
    - tags
    - merge_requests
  cache:
    policy: pull-push
  script:
    - echo "This is a stub message"

build:app:
  stage: build
  extends:
    - .node-modules-cache
  script:
    - pnpm build
  artifacts:
    paths:
      - build
      - src/routes
      - node_modules/.prisma

build:image:
  stage: build
  image: docker:20.10.16
  tags:
    - dind
  services:
    - docker:20.10.16-dind
  needs:
    - build:app
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/image:latest .
    - docker push $CI_REGISTRY_IMAGE/image:latest

lint:js:
  stage: check
  extends:
    - .node-modules-cache
  needs:
    - build:app
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    NODE_OPTIONS: '--max-old-space-size=4096'
  script:
    - pnpm lint:js

lint:types:
  stage: check
  extends:
    - .node-modules-cache
  needs:
    - build:app
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pnpm lint:types

deploy:app:
  stage: deploy
  when: manual
  environment: production
  script:
    - curl $DEPLOY_HOOK_URL

deploy:db:
  stage: deploy
  when: manual
  extends:
    - .node-modules-cache
  environment: production
  script:
    - npx prisma migrate deploy
